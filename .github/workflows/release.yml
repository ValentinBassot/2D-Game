name: Release

on:
  workflow_call:
    secrets:
      RELEASE_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  release:
    name: Promote to main & tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # GITHUB_TOKEN cannot push commits that touch .github/workflows/.
      # Set a RELEASE_TOKEN secret (PAT with repo + workflow scopes) to lift that limit.
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ env.GH_TOKEN }}

      - name: Compute next version
        id: version
        run: |
          version=$(bash .github/scripts/next-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Next version: ${version:-none (no new commit)}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        if: steps.version.outputs.version != ''
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build versioned jar
        if: steps.version.outputs.version != ''
        run: |
          mvn --batch-mode versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          mvn --batch-mode package -DskipTests
          cd target && sha256sum "reboot-$VERSION.jar" > checksums.txt
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Fast-forward main and tag
        if: steps.version.outputs.version != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Fails on purpose if main has commits that release does not have.
          git push origin "$GITHUB_SHA:refs/heads/main"
          git tag -a "v$VERSION" -m "v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Create GitHub Release
        if: steps.version.outputs.version != ''
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes \
            --verify-tag \
            "target/reboot-$VERSION.jar" target/checksums.txt
        env:
          VERSION: ${{ steps.version.outputs.version }}
