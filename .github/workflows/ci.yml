name: CI

on:
  push:
    branches: [release]
  pull_request:
    branches: [dev, release]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on release: it may be in the middle of promoting to main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Every job runs only on the personal repository: the Epitech copy receives the
# same workflow files through the mirror and must not run them a second time.
jobs:
  lint:
    if: github.repository_owner == 'ValentinBassot'
    uses: ./.github/workflows/lint.yml

  test:
    if: github.repository_owner == 'ValentinBassot'
    uses: ./.github/workflows/test.yml

  security:
    if: github.repository_owner == 'ValentinBassot'
    uses: ./.github/workflows/security.yml

  sbom:
    if: github.repository_owner == 'ValentinBassot'
    uses: ./.github/workflows/sbom.yml

  release:
    needs: [lint, test, security, sbom]
    if: github.repository_owner == 'ValentinBassot' && github.event_name == 'push' && github.ref == 'refs/heads/release'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
